services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    # Quick-tunnel hostnames can be negatively cached as NXDOMAIN by local
    # router/ISP resolvers right after a tunnel restart; public resolvers keep
    # the Seedance asset readability check reliable.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./outputs:/app/outputs # Persist outputs
      - ./src:/app/src # Hot reload support (optional if mapped correctly with volume/reload)
    environment:
      - OUTPUT_DIR=/app/outputs
      - DATABASE_PATH=/app/outputs/video_workflow.sqlite3
      - PROJECTS_DIR=/app/outputs/projects
      - COMFYUI_BASE_URL=${COMFYUI_BASE_URL:-http://host.docker.internal:6006}
      - COMFYUI_API_TOKEN=${COMFYUI_API_TOKEN:-}
      - COMFYUI_HOURLY_RATE=${COMFYUI_HOURLY_RATE:-3.03}
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
    ports:
      - "3002:3002"
    environment:
      # This URL is consumed by the browser, so it must use the published host port.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
    depends_on:
      - backend
